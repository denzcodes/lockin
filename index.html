<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>25:00 - LockIn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1> Denz-LockIn🔒</h1>
      <button id="settings-btn" class="icon-btn" aria-label="Settings" title="Customize Timers">⚙️</button>
    </header>

    <div class="modes">
      <button class="mode-btn active" data-mode="work">Locked In</button>
      <button class="mode-btn" data-mode="short">Quick Breather</button>
      <button class="mode-btn" data-mode="long">Recharge</button>
    </div>

    <div class="timer-display" id="timer-display">25:00</div>

    <div class="controls">
      <button id="start-pause-btn" class="primary-btn">Start</button>
      <button id="reset-btn" class="secondary-btn">Reset</button>
    </div>
  </main>

  <!-- Settings Modal -->
  <dialog id="settings-modal" class="modal">
    <form method="dialog" id="settings-form">
      <h2>Timer Settings (Minutes)</h2>
      <div class="input-group">
        <label for="work-input">Focus Duration</label>
        <input type="number" id="work-input" min="1" max="120" value="25" required />
      </div>
      <div class="input-group">
        <label for="short-input">Short Break</label>
        <input type="number" id="short-input" min="1" max="60" value="5" required />
      </div>
      <div class="input-group">
        <label for="long-input">Long Break</label>
        <input type="number" id="long-input" min="1" max="60" value="15" required />
      </div>
      <div class="modal-actions">
        <button type="button" id="cancel-btn" class="secondary-btn">Cancel</button>
        <button type="submit" class="primary-btn">Save</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
